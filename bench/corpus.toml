# Pinned repositories the benchmark runs on. Each is fetched at an exact
# commit (the tag is informational) so numbers stay comparable over time.
#
# `subdir` benchmarks only that folder of the repository. `[*.queries]`
# are the fixed inputs timed after the build: `ask` is a question, `grep`
# a literal, `callers` a symbol, and `skeleton` a file relative to the
# benchmarked tree.
#
# `[*.expect]` lists facts about the pinned source that the graph must get
# right, checked by tests/test_corpus_integration.py: `calls` and `imports`
# edges that must exist and `absent` call edges that must not, each as
# "file#qualified.name -> file#qualified.name" (a file alone for imports).
# Overload suffixes in node ids (`main~3`) are ignored when matching.

[click]
language = "python"
size = "small"
url = "https://github.com/pallets/click"
tag = "8.1.7"
commit = "874ca2bc1c30d93a4ac6e36a15ed685eafe89097"

[click.queries]
ask = "how are command line options parsed"
grep = "def invoke"
callers = "invoke"
skeleton = "src/click/core.py"

[click.expect]
calls = [
  "src/click/termui.py#secho -> src/click/utils.py#echo",
  "src/click/exceptions.py#ClickException.show -> src/click/utils.py#echo",
  "src/click/core.py#BaseCommand.main -> src/click/utils.py#_detect_program_name",
  "src/click/shell_completion.py#_resolve_context -> src/click/core.py#BaseCommand.make_context",
  "src/click/testing.py#CliRunner.invoke -> src/click/core.py#BaseCommand.main",
]
absent = ["src/click/utils.py#echo -> src/click/termui.py#secho"]

[requests]
language = "python"
size = "medium"
url = "https://github.com/psf/requests"
tag = "v2.32.3"
commit = "0e322af87745eff34caffe4df68456ebc20d9068"

[requests.queries]
ask = "how does a session send a prepared request"
grep = "def send"
callers = "send"
skeleton = "src/requests/sessions.py"

[django]
language = "python"
size = "large"
url = "https://github.com/django/django"
tag = "5.1.2"
commit = "c499184f198df8deb8b5f7282b679babef8384ff"

[django.queries]
ask = "how does the ORM compile a queryset to SQL"
grep = "def get_queryset"
callers = "get_queryset"
skeleton = "django/db/models/query.py"

[ripgrep]
language = "rust"
size = "medium"
url = "https://github.com/BurntSushi/ripgrep"
tag = "14.1.1"
commit = "4649aa9700619f94cf9c66876e9549d83420e16c"

[ripgrep.queries]
ask = "how does the searcher read a file"
grep = "fn search"
callers = "search"
skeleton = "crates/core/main.rs"

[ripgrep.expect]
calls = [
  "crates/core/main.rs#search -> crates/core/flags/hiargs.rs#HiArgs.search_worker",
  "crates/core/search.rs#search_path -> crates/searcher/src/searcher/mod.rs#Searcher.search_path",
  "crates/core/flags/parse.rs#parse -> crates/core/flags/hiargs.rs#HiArgs.from_low_args",
  "crates/core/search.rs#SearchWorker.search -> crates/core/haystack.rs#Haystack.path",
  "crates/ignore/examples/walk.rs#main -> crates/ignore/src/walk.rs#WalkBuilder.new",
]
absent = [
  "crates/core/flags/hiargs.rs#HiArgs.search_worker -> crates/core/main.rs#search",
]

[tokio]
language = "rust"
size = "large"
url = "https://github.com/tokio-rs/tokio"
tag = "tokio-1.40.0"
commit = "ea6d652a102dee3f22b490db70545b7f66a23fb7"

[tokio.queries]
ask = "how does the runtime spawn a task"
grep = "fn spawn"
callers = "spawn"
skeleton = "tokio/src/runtime/builder.rs"

[express]
language = "javascript"
size = "small"
url = "https://github.com/expressjs/express"
tag = "4.21.1"
commit = "8e229f92752ad51462c868b99f6e6c2e559801b0"

[express.queries]
ask = "how does the router dispatch a request"
grep = "handle"
callers = "lib/router/index.js"
skeleton = "lib/router/index.js"

[express.expect]
calls = [
  "lib/application.js#app.lazyrouter -> lib/middleware/init.js#init",
  "lib/application.js#app.set -> lib/utils.js#compileETag",
  "lib/response.js#res.send -> lib/utils.js#setCharset",
  "lib/router/route.js#Route.all -> lib/router/layer.js#Layer",
]
imports = [
  "lib/express.js -> lib/application.js",
  "lib/router/index.js -> lib/router/route.js",
]
absent = ["lib/utils.js#setCharset -> lib/response.js#res.send"]

[threejs]
language = "javascript"
size = "large"
