# Bytely CI: lint, the test suite on Linux (every supported Python) and
# Windows, and integration tests on real repositories from the benchmark
# corpus (on both). On a pull request, `pr-report` then posts the results of
# every test job as one comment, edited in place on each push.
# Packaging: `package-build` builds the wheel and source distribution and
# validates them (contents allowlist, twine metadata); `package-install-*`
# installs each into a clean environment on Linux, macOS, and Windows, outside
# the checkout, and runs the installed `bytely` command. Publishing is not
# done here: .github/workflows/release.yml only builds and uploads.
# Dependencies come from uv.lock (`uv sync --locked`), so CI tests exactly
# what is locked and fails when pyproject.toml and the lock disagree.
#
# Test jobs write JUnit XML to reports/<job name>/ and record pytest's exit
# code instead of stopping, so their results are saved to the workspace
# even when tests fail; a last step then fails the job with that code.
version: 2.1

orbs:
  win: circleci/windows@5.0

parameters:
  uv-version:
    type: string
    default: "0.10.10"

executors:
  linux:
    docker:
      - image: cimg/base:current
    resource_class: medium
  macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

commands:
  install-uv:
    description: Install uv and put it on PATH for later steps.
    steps:
      - run:
          name: Install uv << pipeline.parameters.uv-version >>
          command: |
            curl -LsSf https://astral.sh/uv/<< pipeline.parameters.uv-version >>/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  setup-python:
    description: Install uv, then the locked dependencies on a Python version.
    parameters:
      python:
        type: string
    steps:
      - install-uv
      - restore_cache:
          keys:
            - uv-linux-<< parameters.python >>-{{ checksum "uv.lock" }}
      - run:
          name: Install Python << parameters.python >> and dependencies
          command: |
            uv python install << parameters.python >>
            uv sync --locked --extra dev --python << parameters.python >>
      - save_cache:
          key: uv-linux-<< parameters.python >>-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
            - ~/.local/share/uv/python

  save-reports:
    description: Keep reports/ for CircleCI's test view and for pr-report.
    steps:
      - store_test_results:
          path: reports
      - persist_to_workspace:
          root: .
          paths:
            - reports

  fail-if-tests-failed:
    description: Fail the job with the exit code pytest recorded.
    steps:
      - run:
          name: Fail if tests failed
          command: exit "$(cat pytest-status)"

jobs:
  lint:
    executor: linux
    steps:
      - checkout
      - setup-python:
          python: "3.13"
      - run:
          name: Ruff check
          command: uv run --no-sync ruff check src tests bench .circleci
      - run:
          # Also report formatting when the lint step failed, so a pull
          # request learns about both problems in one run.
          name: Ruff format
          command: uv run --no-sync ruff format --check src tests bench .circleci
          when: always
      - run:
          name: Mypy
          command: |
            uv run --no-sync mypy src
            uv run --no-sync mypy bench/run.py bench/fetch.py bench/hotspots.py bench/compare.py .circleci/pr_report.py .circleci/check_package_contents.py .circleci/package_smoke.py

  test:
    parameters:
      python:
        type: string
    executor: linux
    steps:
      - checkout
      - setup-python:
          python: << parameters.python >>
      - run:
          name: Pytest
          command: |
            mkdir -p "reports/$CIRCLE_JOB"
            set +e
            uv run --no-sync pytest -q --junitxml="reports/$CIRCLE_JOB/junit.xml"
            echo $? > pytest-status
      - save-reports
      - fail-if-tests-failed

  test-windows:
    # Windows has a case-insensitive filesystem and CRLF checkouts, where
    # card names and the parity fixtures (.gitattributes) behave differently.
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout
      - run:
          name: Install uv and dependencies
          command: |
            $ErrorActionPreference = "Stop"
            irm https://astral.sh/uv/<< pipeline.parameters.uv-version >>/install.ps1 | iex
            $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
            uv python install 3.13
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            uv sync --locked --extra dev --python 3.13
            exit $LASTEXITCODE
      - run:
          name: Pytest, then integration tests
          command: |
            $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
            $reports = "reports\$env:CIRCLE_JOB"
            New-Item -ItemType Directory -Force $reports | Out-Null
            uv run --no-sync pytest -q --junitxml="$reports\junit.xml"
            $status = $LASTEXITCODE
            uv run --no-sync python bench/fetch.py click express ripgrep
            if ($LASTEXITCODE -and -not $status) { $status = $LASTEXITCODE }
            uv run --no-sync pytest -q -m integration --junitxml="$reports\integration.xml"
            if ($LASTEXITCODE -and -not $status) { $status = $LASTEXITCODE }
            Set-Content -Path pytest-status -Value $status
            exit 0
      - save-reports
      - run:
          name: Fail if tests failed
          command: exit [int](Get-Content pytest-status)

  integration:
    # Real repositories pinned in bench/corpus.toml: known call and import
    # edges, then live edits through one MCP session, each compared with an
    # uncached rebuild (tests/test_corpus_integration.py).
    executor: linux
    steps:
      - checkout
      - setup-python:
          python: "3.13"
      - run:
          name: Fetch pinned repositories
          command: uv run --no-sync python bench/fetch.py click express ripgrep
      - run:
          name: Pytest (integration)
          command: |
            mkdir -p "reports/$CIRCLE_JOB"
            set +e
            uv run --no-sync pytest -q -m integration --junitxml="reports/$CIRCLE_JOB/junit.xml"
            echo $? > pytest-status
      - save-reports
      - fail-if-tests-failed

  package-build:
    # Builds the wheel and source distribution once, rejects any file outside
    # the allowlist, and checks the metadata PyPI will render. The install
    # jobs test exactly these files.
    executor: linux
    steps:
      - checkout
      - setup-python:
          python: "3.13"
      - run:
          name: Build distributions
          command: uv run --no-sync python -m build
      - run:
          name: Check distribution contents
          command: uv run --no-sync python .circleci/check_package_contents.py
      - run:
          name: Check metadata
          command: uv run --no-sync twine check dist/*
      - persist_to_workspace:
          root: .
          paths:
            - dist

  package-install:
    # Installs the built wheel into a fresh environment, away from the
    # checkout, and runs the installed command; then an optional-grammar
    # extra; then the source distribution in place of the wheel.
    parameters:
      os:
        type: executor
      python:
        type: string
    executor: << parameters.os >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-uv
      - run:
          name: Install the wheel and run it (Python << parameters.python >>)
          command: |
            uv venv --python << parameters.python >> "$HOME/pkg"
            . "$HOME/pkg/bin/activate"
            uv pip install dist/*.whl
            python .circleci/package_smoke.py
      - run:
          name: Install an optional grammar extra
          command: |
            . "$HOME/pkg/bin/activate"
            version=$(python -c 'from importlib.metadata import version; print(version("bytely"))')
            uv pip install "bytely[go]==${version}" --no-index --find-links dist --no-deps
            uv pip install "tree-sitter-go>=0.23"
            python -c "import tree_sitter_go"
      - run:
          name: Install the source distribution and run it
          command: |
            . "$HOME/pkg/bin/activate"
            uv pip install --reinstall-package bytely dist/*.tar.gz
            python .circleci/package_smoke.py

  package-install-windows:
    # The same as package-install, in PowerShell.
    parameters:
      python:
        type: string
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install the wheel and run it (Python << parameters.python >>)
          command: |
            $ErrorActionPreference = "Stop"
            irm https://astral.sh/uv/<< pipeline.parameters.uv-version >>/install.ps1 | iex
            $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
            uv venv --python << parameters.python >> "$env:USERPROFILE\pkg"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "$env:USERPROFILE\pkg\Scripts\Activate.ps1"
            uv pip install (Get-ChildItem dist\*.whl).FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python .circleci/package_smoke.py
            exit $LASTEXITCODE
      - run:
          name: Install an optional grammar extra
          command: |
            $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
            & "$env:USERPROFILE\pkg\Scripts\Activate.ps1"
            $version = python -c "from importlib.metadata import version; print(version('bytely'))"
            uv pip install "bytely[go]==$version" --no-index --find-links dist --no-deps
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            uv pip install "tree-sitter-go>=0.23"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python -c "import tree_sitter_go"
            exit $LASTEXITCODE
      - run:
          name: Install the source distribution and run it
          command: |
            $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
            & "$env:USERPROFILE\pkg\Scripts\Activate.ps1"
            uv pip install --reinstall-package bytely (Get-ChildItem dist\*.tar.gz).FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python .circleci/package_smoke.py
            exit $LASTEXITCODE

  pr-report:
    # Posts the test jobs' results to the branch's open pull request. Runs
    # after them whatever their outcome; needs GITHUB_TOKEN from the
    # `bytely-github` context (forks get none, and the report is skipped).
    # On main there is no pull request: it saves the run's summary instead,
    # which pull requests restore to show how the tests changed.
    executor: linux
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-uv
      # The Python 3.13 that test-linux-py3.13 cached (it always runs first),
      # so this job doesn't download Python; the prefix key still finds it
      # after uv.lock changes. Without a cache hit, uv downloads as before.
      - restore_cache:
          keys:
            - uv-linux-3.13-{{ checksum "uv.lock" }}
            - uv-linux-3.13-
      - when:
          condition:
            not:
              equal: [main, << pipeline.git.branch >>]
          steps:
            # The newest main summary: a key prefix restores the most
            # recently saved cache that matches it.
            - restore_cache:
                keys:
                  - test-stats-main-
      - run:
          name: Post test results to the pull request
          command: |
            uv run --no-project --python 3.13 python .circleci/pr_report.py reports \
              --repo-url "<< pipeline.project.git_url >>" \
              --branch "<< pipeline.git.branch >>" \
              --sha "<< pipeline.git.revision >>" \
              --workflow-url "https://app.circleci.com/pipelines/workflows/$CIRCLE_WORKFLOW_ID" \
              --expect test-linux-py3.11,test-linux-py3.12,test-linux-py3.13,test-linux-py3.14,test-windows-py3.13,integration-linux \
              --baseline test-stats/main.json \
              --write-summary test-stats/current.json
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Keep this run's summary as the main baseline
                command: cp test-stats/current.json test-stats/main.json
            - save_cache:
                key: test-stats-main-{{ .Revision }}
                paths:
                  - test-stats/main.json

workflows:
  ci:
    jobs:
      - lint
      # Job names say which platform and Python each suite runs on; the PR
      # comment shows them as they are.
      - test:
          name: test-linux-py<< matrix.python >>
          matrix:
            parameters:
              python: ["3.11", "3.12", "3.13", "3.14"]
      - test-windows:
          name: test-windows-py3.13
      - integration:
          name: integration-linux
      - package-build
      - package-install:
          name: package-<< matrix.os >>-py<< matrix.python >>
          matrix:
            parameters:
              os: [linux, macos]
              python: ["3.11", "3.12", "3.13"]
          requires:
            - package-build
      - package-install-windows:
          name: package-windows-py<< matrix.python >>
          matrix:
            parameters:
              python: ["3.11", "3.12", "3.13"]
          requires:
            - package-build
      - pr-report:
          context: bytely-github
          requires:
            - test-linux-py3.11: terminal
            - test-linux-py3.12: terminal
            - test-linux-py3.13: terminal
            - test-linux-py3.14: terminal
            - test-windows-py3.13: terminal
            - integration-linux: terminal
